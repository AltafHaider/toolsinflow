<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="ToolsInFlow">
  <defs>
    <linearGradient id="tif-bg" x1="8" y1="64" x2="64" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="55%" stop-color="#0F9F73"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="tif-shine" x1="18" y1="14" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tif-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .tif-ring {
        fill: none;
        stroke: rgba(255,255,255,0.55);
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-dasharray: 28 52;
        transform-origin: 36px 36px;
        animation: tif-spin 4.8s linear infinite;
      }
      .tif-ring-2 {
        stroke: rgba(255,255,255,0.28);
        stroke-dasharray: 16 64;
        animation-direction: reverse;
        animation-duration: 7.2s;
      }
      .tif-bolt {
        transform-origin: 36px 36px;
        animation: tif-pop 2.8s ease-in-out infinite;
      }
      .tif-dot {
        animation: tif-blink 2.8s ease-in-out infinite;
      }
      @keyframes tif-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes tif-pop {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes tif-blink {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .tif-ring, .tif-ring-2, .tif-bolt, .tif-dot { animation: none; }
      }
    </style>
  </defs>

  <!-- Bold mark: flowing "T" + orbit = all tools in motion -->
  <rect width="72" height="72" rx="20" fill="url(#tif-bg)"/>
  <rect width="72" height="72" rx="20" fill="url(#tif-shine)"/>

  <circle class="tif-ring" cx="36" cy="36" r="22"/>
  <circle class="tif-ring tif-ring-2" cx="36" cy="36" r="22"/>

  <g class="tif-bolt" filter="url(#tif-glow)">
    <!-- Stylized T for Tools + inflow arrow -->
    <path
      d="M22 24.5h28c1.2 0 1.8 1.5 0.9 2.3l-8.4 7.4c-0.5 0.45-0.8 1.1-0.8 1.8V49.2c0 1.2-1.4 1.9-2.4 1.2l-5.2-3.7c-0.7-0.5-1.1-1.3-1.1-2.1V36c0-0.7-0.3-1.35-0.8-1.8l-8.4-7.4c-0.9-0.8-0.3-2.3 0.9-2.3Z"
      fill="#FFFFFF"
    />
    <circle class="tif-dot" cx="50.5" cy="22.5" r="2.4" fill="#ECFDF5"/>
  </g>
</svg>
